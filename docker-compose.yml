services:
  postgres:
    image: postgres:16-alpine
    container_name: paulopop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paulopop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paulopop123}
      POSTGRES_DB: paulopop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # v1.1: a porta do banco só é exposta se POSTGRES_EXPOSE_PORT for definida (ex.: 127.0.0.1:5432)
    ports:
      - "${POSTGRES_EXPOSE_PORT:-127.0.0.1:65432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paulopop -d paulopop"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Anti-exaustão de disco (hotfix servidor 02/10/2026): limita logs do container
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: paulopop-app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      cache_from:
        - paulopop-app:local
    env_file:
      - .env.local
    container_name: paulopop_app
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

      # Banco de dados interno
      DATABASE_URL: postgresql://paulopop:${POSTGRES_PASSWORD:-paulopop123}@postgres:5432/paulopop?connection_limit=5&pool_timeout=10&connect_timeout=10
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}

      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina NEXTAUTH_SECRET no .env (openssl rand -base64 32)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: http://app:3000

      # IA
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Upload local
      UPLOAD_DIR: /app/public/uploads

      # E-mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-contato@paulopop.com.br}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}

      # Site
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Paulo Pop}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}

      # Analytics (Google Tag Manager)
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}

      # Mapas
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # Anti-exaustão (hotfix servidor 02/10/2026): logs limitados + teto de CPU/RAM
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  postgres_data:
  uploads_data:
